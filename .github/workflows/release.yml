name: release

# Builds and publishes StreamFLOW for Windows as a GitHub Release.
#
# StreamFLOW ships as ONE native executable built from rust/ :
#   StreamFLOW-<version>-win-x64.exe   download and double-click. No installer, no Java, no Python,
#                                      no Visual C++ redistributable - nothing else on the PC.
#
# Triggers:
#   * push a tag like v0.1.0   -> test, build, check, PUBLISH the release
#   * manual "Run workflow"    -> test, build, check; publishes only if "publish" is ticked.
#                                 Left unticked it is a full dry run: the exe is attached to the
#                                 workflow run as an artifact and nothing public is created.
#
# Nothing is published unless the whole test suite passed and the binary check passed.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 0.1.0. Blank = the version in rust/Cargo.toml.'
        required: false
        default: ''
      publish:
        description: 'Publish a public GitHub Release? Leave unticked for a dry run.'
        type: boolean
        required: false
        default: false

env:
  # Run all JavaScript actions on Node 24 - Node 20 is deprecated on the runners.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and check the version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # The one place the version is written: [workspace.package] in rust/Cargo.toml. It is
          # what the exe's own version resource reports (Properties > Details).
          cargo_version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          if [[ -z "$cargo_version" ]]; then
            echo "::error file=rust/Cargo.toml::Could not read [workspace.package] version."; exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            version="$cargo_version"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$version' is not of the form 1.2.3"; exit 1
          fi
          # A download named one number whose Properties page says another is the kind of mistake
          # nobody notices until a user reports it, so refuse to build until they agree.
          if [[ "$cargo_version" != "$version" ]]; then
            echo "::error file=rust/Cargo.toml::rust/Cargo.toml says $cargo_version but the release is $version. Bump [workspace.package] version (and run cargo build so Cargo.lock follows)."; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing StreamFLOW $version"

  # ---------------------------------------------------------------------------------------------
  build:
    name: native exe (Rust)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Release gate. Tests that need the large FCS fixtures (test-assests/, not in the repo) skip
      # themselves.
      - name: Test (whole workspace, release)
        working-directory: rust
        run: cargo test --workspace --release --locked

      - name: Build
        working-directory: rust
        run: cargo build --release --locked -p sf-app

      # Windowed (no console), C runtime linked statically, icon + version resources embedded.
      - name: Check the binary is self-contained and carries its icon
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File rust/check-binary.ps1 -Exe rust/target/release/streamflow.exe

      - name: The exe reports the release version
        shell: pwsh
        run: |
          $want = "${{ needs.version.outputs.version }}"
          $got = (Get-Item rust/target/release/streamflow.exe).VersionInfo.ProductVersion
          Write-Host "ProductVersion: $got"
          if (-not "$got".StartsWith($want)) { throw "The exe says version '$got' but the release is $want." }

      # Hosted runners have no GPU and only the OpenGL 1.1 software driver, which the app's renderer
      # cannot use, so a failure to draw HERE says nothing about a real PC. Reported, not enforced.
      # Run rust/smoke-test.ps1 on a real machine before tagging.
      - name: Start the application (informational on hosted runners)
        continue-on-error: true
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File rust/smoke-test.ps1 -Exe rust/target/release/streamflow.exe

      - name: Name the binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $name = "StreamFLOW-${{ needs.version.outputs.version }}-win-x64.exe"
          Copy-Item rust/target/release/streamflow.exe (Join-Path out $name)
          $mb = [math]::Round((Get-Item (Join-Path out $name)).Length / 1MB, 1)
          Write-Host "$name ($mb MB)"
          Copy-Item NOTICE (Join-Path out "NOTICE.txt")
          Copy-Item THIRD-PARTY-NOTICES.txt out

      - uses: actions/upload-artifact@v4
        with:
          name: StreamFLOW-${{ needs.version.outputs.version }}-win-x64
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  publish:
    name: publish GitHub Release
    needs: [version, build]
    # A tag push always publishes; a manual run only when asked to.
    if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          ls -la
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > ../notes.md <<EOF
          ## Download

          | File | What it is |
          |---|---|
          | \`StreamFLOW-${VERSION}-win-x64.exe\` | **StreamFLOW for Windows 10/11 (64-bit).** One file, no installation: download and double-click. Nothing else needs to be installed. |
          | \`SHA256SUMS.txt\` | Checksum of the file. |
          | \`NOTICE.txt\`, \`THIRD-PARTY-NOTICES.txt\` | Licence notices for the third-party code in the executable. |

          **First run:** the file is not code-signed, so Windows SmartScreen may show
          "Windows protected your PC". Choose **More info**, then **Run anyway**.

          EOF

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists - replacing its files."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "StreamFLOW $VERSION" \
              --notes-file notes.md \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
          gh release view "$TAG" --json url,assets -q '.url, (.assets[] | "  \(.name)  \(.size) bytes")'
